<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cetak Laporan Mutasi</title><style>body{font:12px Arial;color:#222;margin:24px}.head{text-align:center;border-bottom:3px double #222;padding-bottom:12px}.head h2{margin:0}.meta{margin:16px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #777;padding:7px;text-align:left}th{background:#eee}.num{text-align:right}.sign{display:flex;justify-content:space-around;text-align:center;margin-top:65px}.sign div{width:30%}.tools{margin-bottom:16px}button{padding:9px 14px}@page{size:A4 landscape;margin:14mm}@media print{.tools{display:none}body{margin:0}}</style></head><body><div class="tools"><button onclick="window.print()">Cetak / Simpan PDF</button></div><div class="head"><h2>PONDOK PESANTREN ____________________</h2><div>LAPORAN MUTASI BUKU KAS & UANG SAKU SANTRI</div></div><div class="meta" id="meta"></div><table><thead><tr><th>No.</th><th>Tanggal</th><th>NIS</th><th>Nama Santri</th><th>Kategori</th><th>Keterangan</th><th>Nominal (Rp)</th></tr></thead><tbody id="rows"></tbody></table><div id="total"></div><div class="sign"><div>Mengetahui,<br>Wali Kelas<br><br><br><br>(________________)</div><div>Bendahara<br><br><br><br>(________________)</div><div>Pengasuh / Kepala<br><br><br><br>(________________)</div></div><script>const p=new URLSearchParams(location.search);let d=[];try{d=JSON.parse(p.get("data")||"[]")}catch(e){}const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const rp=n=>new Intl.NumberFormat("id-ID").format(Number(n)||0);document.getElementById("meta").textContent=p.get("title")||"Laporan mutasi";document.getElementById("rows").innerHTML=d.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.tanggal)}</td><td>${esc(x.nis)}</td><td>${esc(x.nama)}</td><td>${esc(x.kategori)}</td><td>${esc(x.keterangan)}</td><td class="num">${rp(x.nominal)}</td></tr>`).join("")||'<tr><td colspan="7">Tidak ada transaksi</td></tr>';const masuk=d.filter(x=>x.kategori==="Top-Up").reduce((a,x)=>a+Number(x.nominal),0),keluar=d.filter(x=>x.kategori!=="Top-Up").reduce((a,x)=>a+Number(x.nominal),0);document.getElementById("total").innerHTML=`<p>Total pemasukan: <b>Rp ${rp(masuk)}</b> &nbsp; Total pengeluaran: <b>Rp ${rp(keluar)}</b> &nbsp; Selisih: <b>Rp ${rp(masuk-keluar)}</b></p>`;</script></body></html>
